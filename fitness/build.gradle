plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = 'voxvelo-fitness' }

evaluationDependsOn(':bikes')
evaluationDependsOn(':fitness-lib')

repositories {
	exclusiveContent {
		forRepository {
			maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
		}
		filter { includeGroup 'com.geckolib' }
	}
}

loom {
	splitEnvironmentSourceSets()
	mods {
		'voxvelo_bikes' {
			sourceSet project(':bikes').sourceSets.main
			sourceSet project(':bikes').sourceSets.client
		}
		'voxvelo_fitness_lib' {
			sourceSet project(':fitness-lib').sourceSets.main
			sourceSet project(':fitness-lib').sourceSets.client
		}
		'voxvelo_fitness' {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	implementation project(':bikes')
	implementation project(':fitness-lib')
	clientImplementation rootProject.project(':bikes').sourceSets.client.output
	clientImplementation rootProject.project(':fitness-lib').sourceSets.client.output
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "com.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"
}

processResources {
	def modVersion = project.version
	inputs.property 'version', modVersion
	filesMatching('fabric.mod.json') { expand 'version': modVersion }
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.compilerArgs += ['-Xlint:all', '-Xlint:-classfile', '-Xlint:-this-escape', '-Xlint:-serial', '-Werror']
}
java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
jar { from('../LICENSE') { rename { "${it}_voxvelo_fitness" } } }

sourceSets {
	verification {
		java.setSrcDirs(['../src/verification/java'])
		compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += output + compileClasspath + sourceSets.client.runtimeClasspath
	}
}

tasks.register('verifyVirtualShifting', JavaExec) {
	dependsOn verificationClasses
	classpath = sourceSets.verification.runtimeClasspath
	mainClass = 'dev.michidk.voxvelo.fitnesslib.client.ftms.VirtualShiftingChecks'
}
tasks.named('check') { dependsOn 'verifyVirtualShifting' }

tasks.register('verifyTracks', JavaExec) {
	dependsOn verificationClasses
	classpath = sourceSets.verification.runtimeClasspath
	mainClass = 'dev.michidk.voxvelo.bikes.track.TrackChecks'
}
tasks.named('check') { dependsOn 'verifyTracks' }

