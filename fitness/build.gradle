tasks.register('verifyBuildLayout', JavaExec) {
	dependsOn verificationClasses, tasks.named('jar'), ':bikes:jar', ':fitness-lib:jar'
	classpath = sourceSets.verification.runtimeClasspath
	mainClass = 'dev.michidk.voxvelo.bikes.packaging.BuildLayoutChecks'
	workingDir = rootProject.layout.projectDirectory
	args project(':fitness').layout.buildDirectory.file("libs/voxvelo-fitness-${project.mod_version}.jar").get().asFile,
		project(':bikes').layout.buildDirectory.file("libs/${project.archives_base_name}-bikes-${project.mod_version}.jar").get().asFile,
		project(':fitness-lib').layout.buildDirectory.file("libs/voxvelo-fitness-lib-${project.mod_version}.jar").get().asFile
	systemProperty 'voxvelo_fitness_lib.requiredNatives', providers.gradleProperty('requiredBleNatives').getOrElse('')
}
tasks.named('check') { dependsOn 'verifyBuildLayout' }

tasks.register('verifyRecipeBook', JavaExec) {
