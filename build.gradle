plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.diffplug.spotless' version '8.10.3'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-fitness"
}

evaluationDependsOn(':bikes')
evaluationDependsOn(':fitness')

repositories {
	// GeckoLib (animation and model engine) is hosted on Cloudsmith.
	exclusiveContent {
		forRepository {
			maven {
				name = "GeckoLib"
				url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
			}
		}
		filter {
			includeGroup "com.geckolib"
		}
	}
}

loom {
	// The bicycle adapter shares a dev client with core and the independent fitness services.
	splitEnvironmentSourceSets()

	mods {
		"voxvelo" {
			sourceSet project(':bikes').sourceSets.main
			sourceSet project(':bikes').sourceSets.client
		}
		"voxel_fitness" {
			sourceSet project(':fitness').sourceSets.main
			sourceSet project(':fitness').sourceSets.client
		}
		"voxvelo_fitness" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// The adapter compiles against both dependencies and ships only bicycle integration sources.
sourceSets {
	main.java.setSrcDirs(['src/fitness/main/java'])
	client.java.setSrcDirs(['src/fitness/client/java'])
	main.resources.setSrcDirs(['src/fitness/main/resources'])
	client.resources.setSrcDirs(['src/fitness/client/resources'])
}

dependencies {
	implementation project(':bikes')
	implementation project(':fitness')
	clientImplementation rootProject.project(':fitness').sourceSets.client.output
	clientImplementation rootProject.project(':bikes').sourceSets.client.output
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "com.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

}

processResources {
	def modVersion = project.version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	// Library class files, Minecraft-style constructors and control-flow exceptions only produce noise here.
	it.options.compilerArgs += ['-Xlint:all', '-Xlint:-classfile', '-Xlint:-this-escape', '-Xlint:-serial', '-Werror']
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Formatting and lint for the whole repository (core compiles the same shared sources, so it needs no own config).
// ./gradlew spotlessApply fixes what spotlessCheck (part of check) reports.
spotless {
	java {
		target 'src/**/*.java', 'bikes/src/**/*.java', 'fitness/src/**/*.java', 'examples/**/*.java'
		removeUnusedImports()
		importOrder()
		formatAnnotations()
		leadingSpacesToTabs(4)
		trimTrailingWhitespace()
		endWithNewline()
	}
	groovyGradle {
		target '*.gradle', 'bikes/*.gradle', 'fitness/*.gradle'
		leadingSpacesToTabs(4)
		trimTrailingWhitespace()
		endWithNewline()
	}
	format 'misc', {
		target '*.md', '.gitignore', '.gitattributes', '.github/**/*.yml'
		trimTrailingWhitespace()
		endWithNewline()
	}
}

sourceSets {
	verification {
		compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.client.runtimeClasspath
	}
}

tasks.register('verifyVirtualShifting', JavaExec) {
	dependsOn verificationClasses
	classpath = sourceSets.verification.runtimeClasspath
	mainClass = 'dev.michidk.voxvelo.client.ftms.VirtualShiftingChecks'
}
tasks.named('check') { dependsOn 'verifyVirtualShifting' }

tasks.register('verifyTracks', JavaExec) {
	dependsOn verificationClasses
	classpath = sourceSets.verification.runtimeClasspath
	mainClass = 'dev.michidk.voxvelo.track.TrackChecks'
}
tasks.named('check') { dependsOn 'verifyTracks' }

