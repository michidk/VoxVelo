	dependsOn verificationClasses
	classpath = sourceSets.verification.runtimeClasspath
	mainClass = 'dev.michidk.voxvelo.client.bluetooth.ConnectionChecks'
	// Minecraft's logging configuration writes logs relative to the working directory.
	workingDir = layout.buildDirectory.get().asFile
}
tasks.named('check') { dependsOn 'verifyConnections' }

tasks.register('verifyObcMenus', JavaExec) {
	dependsOn verificationClasses
