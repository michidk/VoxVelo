plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-fitness"
}

repositories {
	// GeckoLib (animation and model engine) is hosted on Cloudsmith.
	exclusiveContent {
		forRepository {
			maven {
				name = "GeckoLib"
				url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
			}
		}
		filter {
			includeGroup "com.geckolib"
		}
	}
}

loom {
	// Client-only code (input devices, rendering, HUD, hardware) lives in src/client
	// so it can never be loaded on a dedicated server.
	splitEnvironmentSourceSets()

	mods {
		"voxelvelo" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "com.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

	// Bluetooth LE for the FTMS trainer. Bundled into the mod jar (it carries native libraries for Windows, Linux and macOS).
	// NOTE: SimpleBLE is licensed under BUSL-1.1, free for non-commercial use. See README.
	implementation "org.simpleble:simplejavable:${project.simpleble_version}"
	include "org.simpleble:simplejavable:${project.simpleble_version}"

	// mDNS discovery of OpenBikeControl devices on the local network (Apache-2.0). Bundled; slf4j comes from Minecraft.
	implementation "org.jmdns:jmdns:${project.jmdns_version}"
	include("org.jmdns:jmdns:${project.jmdns_version}") { transitive = false }
}

processResources {
	def modVersion = project.version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

sourceSets {
	verification {
		compileClasspath += sourceSets.main.output + sourceSets.client.output
		runtimeClasspath += sourceSets.client.runtimeClasspath
	}
}

tasks.register('verifyVirtualShifting', JavaExec) {
	dependsOn verificationClasses
	classpath = sourceSets.verification.runtimeClasspath
	mainClass = 'dev.michidk.voxelvelo.client.ftms.VirtualShiftingChecks'
}
tasks.named('check') { dependsOn 'verifyVirtualShifting' }

tasks.register('verifyTracks', JavaExec) {
	dependsOn verificationClasses
	classpath = sourceSets.verification.runtimeClasspath
	mainClass = 'dev.michidk.voxelvelo.track.TrackChecks'
}
tasks.named('check') { dependsOn 'verifyTracks' }

tasks.register('verifyBikeDurability', JavaExec) {
	dependsOn verificationClasses
	classpath = sourceSets.verification.runtimeClasspath
	mainClass = 'dev.michidk.voxelvelo.bike.BikeDurabilityChecks'
}
tasks.named('check') { dependsOn 'verifyBikeDurability' }

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

// Dev clients start muted: make sure the master volume is 0 in this project's run directory before launching.
def devOptions = layout.projectDirectory.file('run/options.txt').asFile
tasks.matching { it.name == 'runClient' }.configureEach {
	doFirst {
		def lines = devOptions.exists() ? devOptions.readLines() : []
		lines = lines.findAll { !it.startsWith('soundCategory_master:') }
		lines << 'soundCategory_master:0.0'
		devOptions.parentFile.mkdirs()
		devOptions.text = lines.join('\n') + '\n'
	}
}
