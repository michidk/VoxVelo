}
tasks.register('verifyRoads', JavaExec) {
	dependsOn verificationClasses
	classpath = sourceSets.verification.runtimeClasspath
	mainClass = 'dev.michidk.voxvelo.client.road.RoadChecks'
}
tasks.named('check') { dependsOn 'verifyRideSession', 'verifyRoads' }

tasks.register('verifyBuildLayout', JavaExec) {
	dependsOn verificationClasses, tasks.named('jar'), ':bikes:jar', ':fitness:jar'
	classpath = sourceSets.verification.runtimeClasspath
	mainClass = 'dev.michidk.voxvelo.packaging.BuildLayoutChecks'
	workingDir = layout.projectDirectory
	args layout.buildDirectory.file("libs/${project.archives_base_name}-fitness-${project.version}.jar").get().asFile,
		project(':bikes').layout.buildDirectory.file("libs/${project.archives_base_name}-bikes-${project.version}.jar").get().asFile,
		project(':fitness').layout.buildDirectory.file("libs/voxel-fitness-${project.version}.jar").get().asFile
	systemProperty 'voxvelo.requiredNatives', providers.gradleProperty('requiredBleNatives').getOrElse('')
}
tasks.named('check') { dependsOn 'verifyBuildLayout' }

tasks.register('verifyRecipeBook', JavaExec) {
	dependsOn verificationClasses
	classpath = sourceSets.verification.runtimeClasspath
	mainClass = 'dev.michidk.voxvelo.recipe.RecipeBookChecks'
	workingDir = layout.projectDirectory
}
tasks.named('check') { dependsOn 'verifyRecipeBook' }

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

// Dev clients start muted: make sure the master volume is 0 in this project's run directory before launching.
def devOptions = layout.projectDirectory.file('run/options.txt').asFile
tasks.matching { it.name == 'runClient' }.configureEach {
	doFirst {
		def lines = devOptions.exists() ? devOptions.readLines() : []
		lines = lines.findAll { !it.startsWith('soundCategory_master:') }
		lines << 'soundCategory_master:0.0'
		devOptions.parentFile.mkdirs()
		devOptions.text = lines.join('\n') + '\n'
	}
}

tasks.register('verifyFitnessApi', JavaExec) {
	dependsOn verificationClasses
	classpath = sourceSets.verification.runtimeClasspath
	mainClass = 'dev.michidk.voxelfitness.FitnessApiChecks'
}
tasks.named('check') { dependsOn 'verifyFitnessApi' }

tasks.named('check') { dependsOn ':fitness:fitnessExampleJar' }
