plugins {
	id 'base'
	id 'com.diffplug.spotless' version '8.10.3'
}

// The root coordinates verification; only the three subprojects produce mod jars.
repositories { mavenCentral() }
tasks.named('check') { dependsOn ':bikes:check', ':fitness-lib:check', ':fitness:check' }
tasks.named('build') { dependsOn ':bikes:build', ':fitness-lib:build', ':fitness:build' }

spotless {
	java {
		target 'src/**/*.java', 'bikes/src/**/*.java', 'fitness-lib/src/**/*.java', 'fitness/src/**/*.java', 'examples/**/*.java'
		removeUnusedImports()
		importOrder()
		formatAnnotations()
		leadingSpacesToTabs(4)
		trimTrailingWhitespace()
		endWithNewline()
	}
	groovyGradle {
		target '*.gradle', 'bikes/*.gradle', 'fitness-lib/*.gradle', 'fitness/*.gradle'
		leadingSpacesToTabs(4)
		trimTrailingWhitespace()
		endWithNewline()
	}
	format 'misc', {
		target '*.md', '.gitignore', '.gitattributes', '.github/**/*.yml'
		trimTrailingWhitespace()
		endWithNewline()
	}
}
