name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and verify core and fitness
        run: ./gradlew :build :core:build --no-daemon --console=plain
      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: voxelvelo-jars
          path: |
            build/libs/*.jar
            core/build/libs/*.jar
            !**/*-sources.jar
          if-no-files-found: error
