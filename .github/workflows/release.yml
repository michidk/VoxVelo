name: Release

# Push a tag "v<mod_version>" (e.g. v0.1.0) to build, verify and publish three builds:
# Attach all three jars to GitHub, then publish bikes, generic fitness and the bicycle adapter to configured
# Modrinth and CurseForge projects.
#
# Repository variables (project IDs; a platform is skipped while its ID is unset):
#   MODRINTH_BIKES_ID, MODRINTH_FITNESS_ID, CURSEFORGE_BIKES_ID, CURSEFORGE_FITNESS_ID
#   MODRINTH_VOXEL_FITNESS_ID, CURSEFORGE_VOXEL_FITNESS_ID (generic fitness project)
# Repository secrets: MODRINTH_TOKEN, CURSEFORGE_TOKEN

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  natives:
    uses: ./.github/workflows/natives.yml

  release:
    needs: natives
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Download Bluetooth natives
        uses: actions/download-artifact@v4
        with:
          pattern: ble-*
          merge-multiple: true
          path: ble-natives
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read versions and check the tag
        id: versions
        run: |
          mod_version=$(sed -n 's/^mod_version=//p' gradle.properties)
          minecraft_version=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          if [ "${GITHUB_REF_NAME}" != "v${mod_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match mod_version ${mod_version} in gradle.properties"
            exit 1
          fi
          echo "mod=${mod_version}" >> "$GITHUB_OUTPUT"
          echo "minecraft=${minecraft_version}" >> "$GITHUB_OUTPUT"

      - name: Build and verify all three mods
        run: >-
          ./gradlew :build :bikes:build :fitness:build --no-daemon --console=plain
          -PbleNatives="$PWD/ble-natives"
          -PrequiredBleNatives=windows-x86_64,windows-aarch64,linux-x86_64,linux-aarch64,macos-x86_64,macos-aarch64

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.versions.outputs.mod }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease \
            --title "VoxVelo $VERSION" \
            "bikes/build/libs/voxvelo-bikes-$VERSION.jar" \
            "fitness/build/libs/voxel-fitness-$VERSION.jar" \
            "build/libs/voxvelo-fitness-$VERSION.jar"
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > "$RUNNER_TEMP/changelog.md"

      # The bicycle adapter requires matching bikes and generic fitness on both platforms.
      # Fabric API and GeckoLib resolve by mod id, which is also their slug on both platforms.
      - name: Collect dependencies
        id: dependencies
        env:
          MODRINTH_BIKES_ID: ${{ vars.MODRINTH_BIKES_ID }}
          CURSEFORGE_BIKES_ID: ${{ vars.CURSEFORGE_BIKES_ID }}
          MODRINTH_VOXEL_FITNESS_ID: ${{ vars.MODRINTH_VOXEL_FITNESS_ID }}
          CURSEFORGE_VOXEL_FITNESS_ID: ${{ vars.CURSEFORGE_VOXEL_FITNESS_ID }}
          MOD_VERSION: ${{ steps.versions.outputs.mod }}
        run: |
          {
            echo "bikes<<EOF"
            echo "fabric-api(required)"
            echo "geckolib(required)"
            echo "EOF"
            echo "generic<<EOF"
            echo "fabric-api(required)"
            echo "EOF"
            echo "fitness<<EOF"
            echo "fabric-api(required)"
            echo "geckolib(required)"
            bikes_dependency="voxvelo@$MOD_VERSION(required)"
            if [ -n "$MODRINTH_BIKES_ID" ]; then bikes_dependency="$bikes_dependency{modrinth:$MODRINTH_BIKES_ID}"; fi
            if [ -n "$CURSEFORGE_BIKES_ID" ]; then bikes_dependency="$bikes_dependency{curseforge:$CURSEFORGE_BIKES_ID}"; fi
            echo "$bikes_dependency"
            generic_dependency="voxel-fitness@$MOD_VERSION(required)"
            if [ -n "$MODRINTH_VOXEL_FITNESS_ID" ]; then generic_dependency="$generic_dependency{modrinth:$MODRINTH_VOXEL_FITNESS_ID}"; fi
            if [ -n "$CURSEFORGE_VOXEL_FITNESS_ID" ]; then generic_dependency="$generic_dependency{curseforge:$CURSEFORGE_VOXEL_FITNESS_ID}"; fi
            echo "$generic_dependency"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish bikes
        if: vars.MODRINTH_BIKES_ID != '' || vars.CURSEFORGE_BIKES_ID != ''
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_BIKES_ID }}
          modrinth-token: ${{ vars.MODRINTH_BIKES_ID != '' && secrets.MODRINTH_TOKEN || '' }}
          curseforge-id: ${{ vars.CURSEFORGE_BIKES_ID }}
          curseforge-token: ${{ vars.CURSEFORGE_BIKES_ID != '' && secrets.CURSEFORGE_TOKEN || '' }}
          files: bikes/build/libs/voxvelo-bikes-${{ steps.versions.outputs.mod }}.jar
          name: VoxVelo Bikes ${{ steps.versions.outputs.mod }}
          version: ${{ steps.versions.outputs.mod }}
          changelog-file: ${{ runner.temp }}/changelog.md
          loaders: fabric
          game-versions: ${{ steps.versions.outputs.minecraft }}
          java: 25
          dependencies: ${{ steps.dependencies.outputs.bikes }}

      - name: Publish generic fitness
        if: vars.MODRINTH_VOXEL_FITNESS_ID != '' || vars.CURSEFORGE_VOXEL_FITNESS_ID != ''
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_VOXEL_FITNESS_ID }}
          modrinth-token: ${{ vars.MODRINTH_VOXEL_FITNESS_ID != '' && secrets.MODRINTH_TOKEN || '' }}
          curseforge-id: ${{ vars.CURSEFORGE_VOXEL_FITNESS_ID }}
          curseforge-token: ${{ vars.CURSEFORGE_VOXEL_FITNESS_ID != '' && secrets.CURSEFORGE_TOKEN || '' }}
          files: fitness/build/libs/voxel-fitness-${{ steps.versions.outputs.mod }}.jar
          name: Voxel Fitness ${{ steps.versions.outputs.mod }}
          version: ${{ steps.versions.outputs.mod }}
          changelog-file: ${{ runner.temp }}/changelog.md
          loaders: fabric
          game-versions: ${{ steps.versions.outputs.minecraft }}
          java: 25
          dependencies: ${{ steps.dependencies.outputs.generic }}

      - name: Publish fitness
        if: (vars.MODRINTH_FITNESS_ID != '' && vars.MODRINTH_VOXEL_FITNESS_ID != '') || (vars.CURSEFORGE_FITNESS_ID != '' && vars.CURSEFORGE_VOXEL_FITNESS_ID != '')
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_VOXEL_FITNESS_ID != '' && vars.MODRINTH_FITNESS_ID || '' }}
          modrinth-token: ${{ vars.MODRINTH_FITNESS_ID != '' && vars.MODRINTH_VOXEL_FITNESS_ID != '' && secrets.MODRINTH_TOKEN || '' }}
          curseforge-id: ${{ vars.CURSEFORGE_VOXEL_FITNESS_ID != '' && vars.CURSEFORGE_FITNESS_ID || '' }}
          curseforge-token: ${{ vars.CURSEFORGE_FITNESS_ID != '' && vars.CURSEFORGE_VOXEL_FITNESS_ID != '' && secrets.CURSEFORGE_TOKEN || '' }}
          files: build/libs/voxvelo-fitness-${{ steps.versions.outputs.mod }}.jar
          name: VoxVelo Fitness ${{ steps.versions.outputs.mod }}
          version: ${{ steps.versions.outputs.mod }}+fitness
          changelog-file: ${{ runner.temp }}/changelog.md
          loaders: fabric
          game-versions: ${{ steps.versions.outputs.minecraft }}
          java: 25
          dependencies: ${{ steps.dependencies.outputs.fitness }}
